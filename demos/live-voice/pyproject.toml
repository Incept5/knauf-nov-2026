[project]
name = "live-voice"
version = "0.1.0"
description = "MLCon Berlin live voice demo: Parakeet STT, colour words, German translation, FFT. All local on Apple Silicon."
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "websockets==16.0",
    "mlx==0.31.2",
    "mlx-audio==0.4.3",
    "mlx-lm==0.31.3",
    "numpy==2.4.6",
    "soundfile==0.13.1",
]

[project.scripts]
live-voice = "livevoice.server:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "livevoice"
module-root = ""

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Voice</title>
<style>
  :root { --bg: #0b0d12; --fg: #f4f6fb; --dim: rgba(244,246,251,.55); --panel: rgba(0,0,0,.28); }
  :root.light-bg { --fg: #0b0d12; --dim: rgba(11,13,18,.55); --panel: rgba(255,255,255,.30); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    transition: background-color .7s ease, color .7s ease;
    display: grid; grid-template-rows: auto 1fr auto; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 1.2vw; padding: 1.2vh 2vw;
    font-size: clamp(12px, 1.05vw, 20px); color: var(--dim);
  }
  header .title { font-weight: 700; color: var(--fg); letter-spacing: .02em; }
  header .grow { flex: 1; }
  button {
    font: inherit; font-weight: 600; color: var(--fg); background: var(--panel);
    border: 1px solid var(--dim); border-radius: 999px; padding: .45em 1.1em; cursor: pointer;
  }
  button.rec { background: #e0201b; border-color: #e0201b; color: #fff; }
  #dot { width: .8em; height: .8em; border-radius: 50%; background: var(--dim); display: inline-block; }
  #dot.on { background: #ff3b30; box-shadow: 0 0 .6em #ff3b30; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  main { display: grid; grid-template-columns: 1fr auto; gap: 2vw; padding: 0 3vw; min-height: 0; }
  #text { display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; overflow: hidden; padding-bottom: 2vh; }
  .lang { font-size: clamp(11px, 1vw, 18px); font-weight: 700; letter-spacing: .15em; color: var(--dim); margin: 1.2vh 0 .4vh; }
  #history { font-size: 2.6vw; line-height: 1.25; color: var(--dim); overflow: hidden; }
  #history p { margin: .2em 0; }
  #live { font-size: 4.4vw; line-height: 1.15; font-weight: 650; min-height: 1.2em; }
  #live .partial { opacity: .7; }
  #german { font-size: 3.6vw; line-height: 1.2; font-weight: 500; font-style: italic; min-height: 1.2em; }
  #german .prev { display: block; font-size: .62em; color: var(--dim); margin-bottom: .2em; }
  mark { background: none; color: inherit; text-decoration: underline; text-decoration-thickness: .12em; text-underline-offset: .12em; }

  #imgbox { display: none; align-self: center; width: 30vw; }
  #imgbox.on { display: block; }
  #imgbox img { width: 100%; border-radius: 1vw; box-shadow: 0 1vw 3vw rgba(0,0,0,.35); display: block; }
  #imgbox .cap { font-size: 1vw; color: var(--dim); margin-top: .6vh; }

  #chip {
    position: fixed; top: 9vh; right: 3vw; font-size: 2.2vw; font-weight: 700; padding: .3em .9em;
    border-radius: 999px; background: var(--panel); opacity: 0; transform: translateY(-1vh);
    transition: opacity .3s, transform .3s;
  }
  #chip.show { opacity: 1; transform: none; }

  footer { position: relative; height: 24vh; background: rgba(0,0,0,.55); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #fftlabel { position: absolute; left: 1vw; top: .6vh; font-size: clamp(10px, .9vw, 16px); color: rgba(255,255,255,.6); z-index: 2; }
  #help { position: absolute; right: 1vw; top: .6vh; font-size: clamp(10px, .9vw, 16px); color: rgba(255,255,255,.45); z-index: 2; }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <span class="title">Live voice · 100% local</span>
  <span id="models">connecting…</span>
  <span class="grow"></span>
  <span id="stats"></span>
  <button id="sample" title="S">Play sample</button>
  <button id="start" title="Space">Start mic</button>
</header>
<main>
  <section id="text">
    <div id="history"></div>
    <div class="lang">SPEECH · PARAKEET</div>
    <div id="live"></div>
    <div class="lang" id="delabel">DEUTSCH · QWEN</div>
    <div id="german"></div>
  </section>
  <aside id="imgbox"><img id="img" alt=""><div class="cap" id="imgcap"></div></aside>
</main>
<div id="chip"></div>
<footer>
  <div id="fftlabel">Spectrogram 0–8 kHz (Web Audio FFT, 1024 points)</div>
  <div id="help">Space mic · S sample · C clear · F full screen · K colour reset</div>
  <canvas id="spec"></canvas>
  <canvas id="bars"></canvas>
</footer>
<script src="/static/app.js?v=2"></script>
</body>
</html>
